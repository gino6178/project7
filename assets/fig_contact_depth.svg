  <g id="text_26">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="4.32" y="14.957812" transform="rotate(-0 4.32 14.957812)">The detected pixel agrees with the arm. The depth along that pixel’s ray does not.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="4.32" y="37.508212" transform="rotate(-0 4.32 37.508212)">At the contact frame, over 58 contacts in 8 venues. The ray is the tracker’s raw detection; the body never sees a shuttle.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #5c6b70" transform="translate(557.712 361.30365)">A wrist that merely happened to lie near the shuttle’s sight-line would not dip at frame 0.</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #5c6b70" transform="translate(557.712 370.709812)">This is what rules out a misidentified striker.</text>
  </g>

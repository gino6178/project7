   <g id="text_1">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="35.568" y="26.496" transform="rotate(-0 35.568 26.496)">What makes the fitted body metric rather than merely plausible</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="35.568" y="45.8496" transform="rotate(-0 35.568 45.8496)">The unknowns are solved per frame against one broadcast skeleton, then the whole sequence is refined together.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #141b1e" x="120.384" y="105.12" transform="rotate(-0 120.384 105.12)">what is solved for</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="123.264" transform="rotate(-0 47.1744 123.264)">global orientation      3</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="140.1984" transform="rotate(-0 47.1744 140.1984)">pose latent            32</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="157.1328" transform="rotate(-0 47.1744 157.1328)">translation             3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="174.0672" transform="rotate(-0 47.1744 174.0672)">body shape             10</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="207.936" transform="rotate(-0 47.1744 207.936)">per frame, warm-started</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="47.1744" y="224.8704" transform="rotate(-0 47.1744 224.8704)">from the previous solution</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e8552f" x="120.384" y="240.192" transform="rotate(-0 120.384 240.192)">48 numbers per body</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #141b1e" x="374.832" y="105.12" transform="rotate(-0 374.832 105.12)">the objective</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="261.4464" y="130.1184" transform="rotate(-0 261.4464 130.1184)">reprojection of 17 joints</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="144.6336" transform="rotate(-0 261.4464 144.6336)">weighted Huber, through the</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="158.3424" transform="rotate(-0 261.4464 158.3424)">venue projection matrix</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="261.4464" y="179.3088" transform="rotate(-0 261.4464 179.3088)">ankle anchor</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="193.824" transform="rotate(-0 261.4464 193.824)">ankle pixels back-projected to</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="207.5328" transform="rotate(-0 261.4464 207.5328)">the court plane — pins the depth</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="261.4464" y="228.4992" transform="rotate(-0 261.4464 228.4992)">sole contact</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="243.0144" transform="rotate(-0 261.4464 243.0144)">lowest MESH vertex at z = 0,</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="256.7232" transform="rotate(-0 261.4464 256.7232)">not the ankle joint (7 cm off)</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="261.4464" y="277.6896" transform="rotate(-0 261.4464 277.6896)">pose prior</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="292.2048" transform="rotate(-0 261.4464 292.2048)">the pose IS a decoded latent,</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="261.4464" y="305.9136" transform="rotate(-0 261.4464 305.9136)">so implausible poses are unreachable</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #141b1e" x="618.12" y="105.12" transform="rotate(-0 618.12 105.12)">what it prevents</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(584.164375 131.35875)">fitting to noise in</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(575.82125 141.836687)">low-confidence joints</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(561.159375 180.54915)">depth from apparent height:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(579.53125 191.027087)">both players pulled</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(567.2575 201.505025)">0.8 m toward the camera</text>
   </g>
   <g id="text_27">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(578.584375 229.73955)">the body floating or</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(586.526875 240.217487)">sinking by 7 cm</text>
   </g>
   <g id="text_28">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(578.41375 278.92995)">lunges paid for with</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #e8552f" transform="translate(570.67125 289.407887)">implausible joint angles</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #141b1e" x="799.8048" y="105.12" transform="rotate(-0 799.8048 105.12)">what comes out</text>
   </g>
   <g id="text_30">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="123.264" transform="rotate(-0 799.8048 123.264)">reprojection</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="140.1984" transform="rotate(-0 799.8048 140.1984)">3.8 px median</text>
   </g>
   <g id="text_32">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="174.0672" transform="rotate(-0 799.8048 174.0672)">max joint angle 111°</text>
   </g>
   <g id="text_33">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="191.0016" transform="rotate(-0 799.8048 191.0016)">joint speed p99</text>
   </g>
   <g id="text_34">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="207.936" transform="rotate(-0 799.8048 207.936)">253 °/s</text>
   </g>
   <g id="text_35">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c6b70" x="799.8048" y="241.8048" transform="rotate(-0 799.8048 241.8048)">on the human manifold</text>
   </g>
   <g id="text_36">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #141b1e" x="48.96" y="341.7984" transform="rotate(-0 48.96 341.7984)">then the whole sequence at once</text>
   </g>
   <g id="text_37">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="48.96" y="358.3296" transform="rotate(-0 48.96 358.3296)">One body shape shared across all frames, and second-difference penalties on the latent, the root orientation and the translation.</text>
   </g>
   <g id="text_38">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6b70" x="48.96" y="370.4256" transform="rotate(-0 48.96 370.4256)">This replaces post-hoc smoothing, which filtered in the wrong space: filtering vertices slides the joints, filtering parameters does not.</text>
   </g>
